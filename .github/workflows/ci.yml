name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Ubuntu 23.10+ blocks the unprivileged user namespaces that Chrome's sandbox uses
      - name: Allow Chrome sandbox
        if: runner.os == 'Linux'
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns

      - run: npm ci

      # Newer npm versions skip Puppeteer's install script, which downloads Chrome
      - run: npx puppeteer browsers install chrome

      - run: npm test
