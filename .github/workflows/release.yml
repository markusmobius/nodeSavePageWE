name: Release

# Runs when a version tag such as v1.0.0 is pushed: runs the tests, stages the package on npm and creates the
# GitHub release. A maintainer then approves the staged version with 2FA on npmjs.com (Staged Packages tab) or
# with `npm stage approve <stage-id>`. See DEVELOPMENT.md.
#
# npm authentication, either:
#   - repository secret NPM_TOKEN: an npm granular access token with "Read and write (stage only)" permission, or
#   - npm trusted publishing (OIDC) for this workflow, configured on npmjs.com - then no secret is needed.

on:
  push:
    tags: ['v*']

permissions:
  contents: write  # to create the GitHub release
  id-token: write  # for npm trusted publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Check tag matches package.json version
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

      # Ubuntu 23.10+ blocks the unprivileged user namespaces that Chrome's sandbox uses
      - name: Allow Chrome sandbox
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns

      - run: npm ci

      # Newer npm versions skip Puppeteer's install script, which downloads Chrome
      - run: npx puppeteer browsers install chrome

      - run: npm test

      # `npm stage` needs npm 11.15.0 or later - newer than the npm bundled with Node 22
      - run: npm install --global npm@^11.15.0

      - name: Stage the package on npm for approval
        run: npm stage publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        run: |
          # Release notes: this version's section of CHANGELOG.md
          awk -v v="${GITHUB_REF_NAME#v}" '/^## /{p=($2==v); next} p' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
